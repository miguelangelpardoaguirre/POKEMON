<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/stilos.css">
</head>
<body class="container">
    <header>
      <!--icono y logo-->
        <nav>
            <a href="index.html" > <img src="img/Pokémon_logo.svg.png" id="logo" alt="logo"></a>
            <div>
              <a href=""> <img src="img/Poké_Ball_icon.svg.png" alt="compras"> <span id="cuenta-carrito">0</span></a>
            </div>
        </nav> 
    </header>
    <!--tabla para el carrito-->
  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Total</th>
        <th>Eliminar</th>
      </tr>
    </thead>
    <tbody id="tabla-carrito">
      <!-- Aqui van los Pokemon del carrito -->
    </tbody>
  </table>
  <!--valor a pagar traido del js-->
  <h3 class="mt-4 titulo blanco">Total a pagar: <span id="total-general">0</span> COP</h3>
  <!--boton vaciar carrito y completar compra-->
  <div class="row">
    <div class="col">
      <button id="vaciar-carrito" class="btn btn-warning w-100">Vaciar Pokeball</button>
    </div>
    <div class="col">
      <button id="vaciar-carrito" class="btn btn-info w-100">Completar compra</button>
    </div>
  </div>

  <footer>
    <div class="row">
     <div class="col gris2">
         <h4>contactanos</h4>
         <h5>3009983734</h5>
         <h5>poke@tienda.com</h5>
     </div>
    </div>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="js/codigo.js"></script>
  <script src="js/servicios.js"></script>
</body>
</html>
